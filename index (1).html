<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأستاذ محمد</title>
<style>
:root{--bg:#f1f6f4;--card:#fff;--tx:#17302b;--mu:#5d7a73;--pr:#0b5566;--pr2:#0a3a4a;--gd:#d4a017;--bd:#d6e4e0;--rd:#dc2626;--gr:#16a34a;--am:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a18;--card:#16262a;--tx:#e6f2ef;--mu:#8fb0a8;--bd:#264043;--pr:#1596ad;--pr2:#0a3a4a}}
:root[data-theme="dark"]{--bg:#0e1a18;--card:#16262a;--tx:#e6f2ef;--mu:#8fb0a8;--bd:#264043;--pr:#1596ad;--pr2:#0a3a4a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px}
header{background:linear-gradient(135deg,#0a3a4a,#0b5566);color:#fff;padding:16px;display:flex;align-items:center;gap:14px;border-radius:0 0 26px 26px;border-bottom:4px solid var(--gd)}
#logo{width:92px;height:92px;border-radius:50%;background:#0a3a4a;border:3px solid var(--gd);box-shadow:0 0 14px #d4a01788;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex:none}
#logo img{width:100%;height:100%;object-fit:cover}
header h1{margin:0;font-size:24px;color:#f5d77a}header small{opacity:.9;font-size:13px}
main{padding:14px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.sub{display:flex;align-items:center;gap:12px;cursor:pointer}
.ic{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#0a3a4a,#0b5566);border:2px solid var(--gd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.sub b{font-size:17px}.mu{color:var(--mu);font-size:13px}
button{font-family:inherit;font-size:15px;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--pr);color:#fff}
button.sec{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}
button.red{background:var(--rd)}
.fab{width:100%;padding:14px;font-size:16px;margin-top:4px;background:var(--gd);color:#1b2a2e;font-weight:bold}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--gd);border-width:2px}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.bar button{flex:1}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:100%}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--pr);color:#fff;font-size:13px;cursor:pointer}
td.n{text-align:right;position:sticky;right:0;background:var(--card);font-weight:bold;min-width:96px;cursor:pointer}
th.n{position:sticky;right:0;z-index:1}
td input{width:58px;padding:7px 2px;text-align:center;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-family:inherit;font-size:15px}
.s{background:var(--pr2)!important;font-size:12px;font-weight:normal;line-height:1.3}td.cc{background:rgba(212,160,23,.14);font-weight:bold;min-width:56px}.tot{font-weight:bold;color:var(--pr)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.st{display:flex;gap:6px}.st button{padding:8px 12px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.st button.p.on{background:var(--gr);color:#fff}.st button.a.on{background:var(--rd);color:#fff}.st button.e.on{background:var(--am);color:#fff}
.sum{display:flex;gap:8px;margin-bottom:10px}.sum div{flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}
.sum b{display:block;font-size:20px}
textarea.t,input.t,input[type=date]{font-family:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-family:inherit;font-size:16px;margin:4px 0 10px}
#ov{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#ov .box{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:380px}
.empty{text-align:center;color:var(--mu);padding:24px}
</style>
</head>
<body>
<header>
  <div id="logo" onclick="document.getElementById('pic').click()"></div>
  <div><h1>الأستاذ محمد</h1><small>سجل الدرجات والحضور</small></div>
</header>
<input type="file" id="pic" accept="image/*" hidden>
<main id="app"></main>
<div id="ov"><div class="box" id="box"></div></div>
<script>
var S={logo:'',subjects:[]},cur=null,tab='g',day=new Date().toISOString().slice(0,10);
try{var r=localStorage.getItem('ostath1');if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem('ostath1',JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function sb(){var r=S.subjects.filter(function(x){return x.id===cur})[0];if(r)ensure(r);return r}
function logo(){var l=document.getElementById('logo');l.innerHTML=S.logo?'<img src="'+S.logo+'">':'📚'}
document.getElementById('pic').onchange=function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=c.height=160;var x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);S.logo=c.toDataURL('image/jpeg',.8);save();logo()};im.src=rd.result};rd.readAsDataURL(f)};
function modal(title,fields,ok,del){
  var h='<h3 style="margin:0 0 8px">'+title+'</h3>';
  fields.forEach(function(f,i){h+='<label class="mu">'+f[0]+'</label>'+(f[1]=='area'?'<textarea class="t" id="f'+i+'" rows="'+(f[3]||9)+'" placeholder="محمد علي&#10;أحمد حسن&#10;زينب كريم">'+esc(f[2]||'')+'</textarea>':'<input class="t" id="f'+i+'" type="'+(f[1]||'text')+'" value="'+esc(f[2]||'')+'">')});
  h+='<div class="bar" style="margin:0">'+(ok?'<button id="mok">حفظ</button>':'')+(del?'<button class="red" id="mdel">حذف</button>':'')+'<button class="sec" id="mno">إلغاء</button></div>';
  var b=document.getElementById('box');b.innerHTML=h;document.getElementById('ov').style.display='flex';
  function close(){document.getElementById('ov').style.display='none'}
  document.getElementById('mno').onclick=close;
  if(ok)document.getElementById('mok').onclick=function(){var v=fields.map(function(f,i){return document.getElementById('f'+i).value.trim()});if(!v[0])return;ok(v);close();save();render()};
  if(del)document.getElementById('mdel').onclick=function(){del();close();save();render()};
}
function render(){
  var a=document.getElementById('app'),s=sb();
  if(!s){
    var h='';
    if(!S.subjects.length)h='<div class="empty">ما عندك مواد بعد.<br>اضغط «إضافة مادة» للبدء 👇</div>';
    S.subjects.forEach(function(x){h+='<div class="card sub" onclick="openSub(\''+x.id+'\')"><div class="ic">📖</div><div style="flex:1"><b>'+esc(x.name)+'</b><div class="mu">'+esc(x.cls)+' • '+x.students.length+' طالب</div></div><span class="mu">‹</span></div>'});
    h+='<button class="fab" onclick="addSub()">＋ إضافة مادة</button>';
    a.innerHTML=h;return;
  }
  var h='<div class="row" style="margin-top:6px"><button class="sec" onclick="cur=null;render()">› رجوع</button><b>'+esc(s.name)+'</b><button class="sec" onclick="editSub()">تعديل</button></div>';
  h+='<div class="mu" style="text-align:center">'+esc(s.cls)+'</div>';
  h+='<div class="tabs"><button class="'+(tab=='g'?'on':'')+'" onclick="tab=\'g\';render()">الدرجات</button><button class="'+(tab=='a'?'on':'')+'" onclick="tab=\'a\';render()">الحضور والغياب</button><button class="'+(tab=='m'?'on':'')+'" onclick="tab=\'m\';render()">الملخص</button></div>';
  if(tab!='m')h+='<div class="bar"><button onclick="addSt()">＋ طالب</button>'+(tab=='g'?'<button class="sec" onclick="editParts()">⚙ تقسيم الدرجات</button>':'')+'</div>';
  if(!s.students.length)h+='<div class="empty">أضف الطلاب أولاً</div>';
  else h+=tab=='g'?grades(s):tab=='a'?attend(s):summary(s);
  a.innerHTML=h;
}
function fmt(x){return x===null||x===undefined||isNaN(x)?'-':String(Math.round(x*10)/10)}
function ensure(s){if(!s.act)s.act=[{id:'a',name:'تحضير ومناقشة',max:50},{id:'b',name:'نشاط لاصفي',max:30},{id:'c',name:'سلوك ومواظبة',max:20}];if(!s.wr)s.wr=[{id:'w',name:'التحريري',max:100}]}
function mth(g,m,s){var ac=0,am=0,wr=0,wm=0,has=false;s.act.forEach(function(p){var v=g[m+p.id];if(v!==undefined&&v!==''){has=true;ac+=+v||0}am+=+p.max});s.wr.forEach(function(p){var v=g[m+p.id];if(v!==undefined&&v!==''){has=true;wr+=+v||0}wm+=+p.max});return{has:has,ac:ac,wr:wr,fin:((am?ac/am*100:0)+(wm?wr/wm*100:0))/2}}
function semOf(g,s){var a=mth(g,'m1',s),b=mth(g,'m2',s);return a.has&&b.has?(a.fin+b.fin)/2:null}
function inp(t,k,mx,g){var v=g[k];return '<td><input type="number" inputmode="decimal" value="'+(v===undefined?'':v)+'" onfocus="this.select()" enterkeyhint="next" oninput="setG(\''+t+'\',\''+k+'\','+mx+',this)"></td>'}
function sum(a){return a.reduce(function(x,p){return x+(+p.max)},0)}
function grades(s){
var an=s.act.length,wn=s.wr.length,cs=an+1+wn+(wn>1?1:0)+1;
var h='<div class="mu" style="text-align:center;margin-bottom:6px">الدرجة النهائية = (النشاط + التحريري) ÷ 2 • معدل الفصل = (الشهر الأول + الشهر الثاني) ÷ 2</div><div class="wrap"><table><tr><th class="n" rowspan="2">الاسم الثلاثي</th><th colspan="'+cs+'">الشهر الأول</th><th colspan="'+cs+'">الشهر الثاني</th><th rowspan="2">معدل الفصل الأول</th><th rowspan="2">نصف السنة<br><small>100</small></th></tr><tr>';
for(var i=0;i<2;i++){s.act.forEach(function(p){h+='<th class="s">'+esc(p.name)+'<br>'+p.max+'</th>'});h+='<th class="s">مجموع النشاط<br>'+sum(s.act)+'</th>';s.wr.forEach(function(p){h+='<th class="s">'+esc(p.name)+'<br>'+p.max+'</th>'});if(wn>1)h+='<th class="s">مجموع التحريري<br>'+sum(s.wr)+'</th>';h+='<th class="s">الدرجة النهائية<br>100</th>'}
h+='</tr>';
s.students.forEach(function(t,i){var g=s.grades[t.id]||{};
h+='<tr><td class="n" onclick="editSt(\''+t.id+'\')">'+(i+1)+'. '+esc(t.name)+'</td>';
['m1','m2'].forEach(function(m){var r=mth(g,m,s),f=function(x){return r.has?fmt(x):''};
s.act.forEach(function(p){h+=inp(t.id,m+p.id,p.max,g)});h+='<td class="cc" id="ac'+t.id+m+'">'+f(r.ac)+'</td>';
s.wr.forEach(function(p){h+=inp(t.id,m+p.id,p.max,g)});if(wn>1)h+='<td class="cc" id="wt'+t.id+m+'">'+f(r.wr)+'</td>';
h+='<td class="cc" id="fn'+t.id+m+'">'+f(r.fin)+'</td>'});
h+='<td class="cc tot" id="sm'+t.id+'">'+fmt(semOf(g,s))+'</td>'+inp(t.id,'mid',100,g)+'</tr>'});
return h+'</table></div>'}
var PRE={ar:'إنشاء 25\nقواعد 25\nأدب 25\nمطالعة 25',en:'قواعد 25\nاستماع 25\nقراءة 25\nكتابة 25',n:'التحريري 100'};
function ptxt(a){return a.map(function(p){return p.name+' '+p.max}).join('\n')}
function parseP(t,old){return t.split(/\n+/).map(function(x){return x.trim()}).filter(Boolean).map(function(l,i){var m=l.match(/^(.*?)[\s=:\-]*(\d+(?:\.\d+)?)$/),n=m?m[1].trim():l;return{id:old[i]?old[i].id:'p'+Date.now().toString(36)+i,name:n||('جزء '+(i+1)),max:m?+m[2]:100}})}
function setW(t){document.getElementById('f1').value=t}
function editParts(){var s=sb();modal('تقسيم الدرجات',[['أجزاء النشاط (سطر لكل جزء: الاسم ثم الدرجة)','area',ptxt(s.act),4],['أجزاء التحريري (سطر لكل جزء: الاسم ثم الدرجة)','area',ptxt(s.wr),5]],function(v){var a=parseP(v[0],s.act),w=parseP(v[1],s.wr);if(a.length)s.act=a;if(w.length)s.wr=w});document.getElementById('f1').insertAdjacentHTML('beforebegin','<div class="bar" style="margin:4px 0"><button type="button" class="sec" onclick="setW(PRE.ar)">عربي</button><button type="button" class="sec" onclick="setW(PRE.en)">إنكليزي</button><button type="button" class="sec" onclick="setW(PRE.n)">عادي</button></div>')}
function attend(s){
  var d=s.att[day]||{},p=0,a=0,e=0;
  s.students.forEach(function(t){var v=d[t.id];if(v=='p')p++;if(v=='a')a++;if(v=='e')e++});
  var h='<input type="date" value="'+day+'" onchange="day=this.value;render()">';
  h+='<div class="sum"><div><b style="color:var(--gr)">'+p+'</b>حاضر</div><div><b style="color:var(--rd)">'+a+'</b>غائب</div><div><b style="color:var(--am)">'+e+'</b>مجاز</div></div>';
  s.students.forEach(function(t,i){
    var v=d[t.id],tot=0;Object.keys(s.att).forEach(function(k){if(s.att[k][t.id]=='a')tot++});
    h+='<div class="card row"><div><b>'+(i+1)+'. '+esc(t.name)+'</b><div class="mu">مجموع الغيابات: '+tot+'</div></div><div class="st">'
    +'<button class="p '+(v=='p'?'on':'')+'" onclick="setA(\''+t.id+'\',\'p\')">ح</button>'
    +'<button class="a '+(v=='a'?'on':'')+'" onclick="setA(\''+t.id+'\',\'a\')">غ</button>'
    +'<button class="e '+(v=='e'?'on':'')+'" onclick="setA(\''+t.id+'\',\'e\')">م</button></div></div>';
  });
  return h+'<div class="mu" style="text-align:center">ح = حاضر • غ = غائب • م = مجاز</div>';
}
function openSub(i){cur=i;tab='g';render();window.scrollTo(0,0)}
function setG(t,k,mx,el){var v=el.value;if(v!==''&&+v>mx){v=String(mx);el.value=v}if(v!==''&&+v<0){v='0';el.value=v}var s=sb();s.grades[t]=s.grades[t]||{};s.grades[t][k]=v;save();updRow(t)}
function updRow(t){var s=sb(),g=s.grades[t]||{};['m1','m2'].forEach(function(m){var r=mth(g,m,s);[['ac',r.ac],['wt',r.wr],['fn',r.fin]].forEach(function(q){var e=document.getElementById(q[0]+t+m);if(e)e.textContent=r.has?fmt(q[1]):''})});var e=document.getElementById('sm'+t);if(e)e.textContent=fmt(semOf(g,s))}
document.addEventListener('keydown',function(e){if(e.key!=='Enter'||!e.target.matches('td input'))return;var td=e.target.parentNode,tr=td.parentNode,i=Array.prototype.indexOf.call(tr.children,td),n=tr.nextElementSibling;if(n&&n.children[i]){var x=n.children[i].querySelector('input');if(x){x.focus();x.select()}}});
function setA(t,v){var s=sb();s.att[day]=s.att[day]||{};s.att[day][t]=s.att[day][t]==v?'':v;save();render()}
function addSub(){modal('إضافة مادة',[['اسم المادة','text'],['الصف والشعبة','text','']],function(v){S.subjects.push({id:id(),name:v[0],cls:v[1],students:[],exams:[{id:id(),name:'الشهر الأول',max:100},{id:id(),name:'الشهر الثاني',max:100}],grades:{},att:{}})})}
function editSub(){var s=sb();modal('تعديل المادة',[['اسم المادة','text',s.name],['الصف والشعبة','text',s.cls]],function(v){s.name=v[0];s.cls=v[1]},function(){S.subjects=S.subjects.filter(function(x){return x.id!==s.id});cur=null})}
function addSt(){var s=sb();modal('إضافة طلاب',[['الصق الأسماء: اسم بكل سطر','area']],function(v){v[0].split(/\n+/).forEach(function(n){n=n.replace(/^[\s\d\.\-\)]+/,'').trim();if(n)s.students.push({id:id(),name:n})})})}
function editSt(i){var s=sb(),t=s.students.filter(function(x){return x.id===i})[0];modal('تعديل الطالب',[['الاسم','text',t.name]],function(v){t.name=v[0]},function(){s.students=s.students.filter(function(x){return x.id!==i})})}
function addEx(){var s=sb();modal('إضافة اختبار',[['اسم الاختبار (مثل: نصف السنة)','text'],['الدرجة العظمى','number','100']],function(v){s.exams.push({id:id(),name:v[0],max:+v[1]||100})})}
function editEx(i){var s=sb(),e=s.exams.filter(function(x){return x.id===i})[0];modal('تعديل الاختبار',[['الاسم','text',e.name],['الدرجة العظمى','number',e.max]],function(v){e.name=v[0];e.max=+v[1]||100},function(){s.exams=s.exams.filter(function(x){return x.id!==i})})}

var sortR=true;
function stats(s,t){var g=s.grades[t.id]||{},p=0,a=0,x=0;Object.keys(s.att).forEach(function(k){var v=s.att[k][t.id];if(v=='p')p++;if(v=='a')a++;if(v=='e')x++});var m=g.mid;return{pc:semOf(g,s),mid:(m===undefined||m==='')?null:+m,p:p,a:a,x:x,days:p+a+x,t:t}}
function summary(s){
var L=s.students.map(function(t){return stats(s,t)});
var rk=L.filter(function(r){return r.pc!==null}).sort(function(a,b){return b.pc-a.pc});
rk.forEach(function(r,i){r.rk=(i>0&&r.pc===rk[i-1].pc)?rk[i-1].rk:i+1});
var n=rk.length,avg=n?rk.reduce(function(a,r){return a+r.pc},0)/n:0,fail=rk.filter(function(r){return r.pc<50}).length;
var dd=Object.keys(s.att).filter(function(k){return Object.keys(s.att[k]).some(function(i){return s.att[k][i]})}).length;
var hi=n?Math.round(rk[0].pc)+'%':'-',lo=n?Math.round(rk[n-1].pc)+'%':'-';
var h='<div class="sum"><div><b>'+s.students.length+'</b>الطلاب</div><div><b>'+(n?Math.round(avg)+'%':'-')+'</b>متوسط الصف</div><div><b>'+dd+'</b>أيام الحضور</div></div>';
h+='<div class="sum"><div><b style="color:var(--gr)">'+hi+'</b>أعلى نسبة</div><div><b style="color:var(--am)">'+lo+'</b>أدنى نسبة</div><div><b style="color:var(--rd)">'+fail+'</b>تحت 50%</div></div>';
var rows=sortR?L.slice().sort(function(a,b){if(a.pc===null&&b.pc===null)return 0;if(a.pc===null)return 1;if(b.pc===null)return -1;return b.pc-a.pc}):L;
h+='<div class="bar"><button class="sec" onclick="sortR=!sortR;render()">'+(sortR?'الترتيب: حسب الدرجات ⇅':'الترتيب: حسب القائمة ⇅')+'</button></div>';
h+='<div class="wrap"><table><tr><th>الترتيب</th><th class="n">الطالب</th><th>حاضر</th><th>غائب</th><th>مجاز</th><th>نسبة الحضور</th><th>معدل الفصل</th><th>نصف السنة</th></tr>';
rows.forEach(function(r){var m=r.rk==1?'🥇':r.rk==2?'🥈':r.rk==3?'🥉':(r.rk||'-');var ap=r.days?Math.round(r.p/r.days*100)+'%':'-';
h+='<tr><td>'+m+'</td><td class="n" style="cursor:default">'+esc(r.t.name)+'</td><td style="color:var(--gr)">'+r.p+'</td><td style="color:var(--rd)">'+r.a+'</td><td style="color:var(--am)">'+r.x+'</td><td>'+ap+'</td><td class="tot">'+fmt(r.pc)+'</td><td class="tot" style="color:'+(r.mid!==null&&r.mid<50?'var(--rd)':'var(--pr)')+'">'+fmt(r.mid)+'</td></tr>'});
return h+'</table></div><div class="mu" style="text-align:center;margin-top:8px">الترتيب حسب معدل الفصل الأول • الراسب = أقل من 50</div>'}
